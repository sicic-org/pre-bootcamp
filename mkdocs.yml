site_name: Super Individuals Bootcamp
site_description: The definitive guide to building your ZeroClaw Agent.
# Canonical / sitemap / og links resolve against this domain (P1.5 A).
site_url: https://learn.sicic.org/
theme:
  name: material
  custom_dir: overrides
  # SICIC brand logo for the top-left home link (P1.5 D / branding).
  logo: assets/images/sicic-logo.png
  # Brand typography: Inter for body (Fraunces for headings is loaded in
  # overrides/main.html and applied in stylesheets/extra.css).
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    scheme: default
    primary: white
    accent: indigo
  features:
    - navigation.sections
    - navigation.expand
    - navigation.footer
    - navigation.top
    - toc.integrate
    - content.code.copy

nav:
  - Welcome: index.md
  - 1. The Foundation:
      - "VPS: Your Private AI Home": infrastructure/vps.md
      - "ZeroClaw: The Software That Runs Your Agent": infrastructure/zeroclaw-core.md
  - 2. The Interface:
      - "Telegram: Your Everyday Control Room": interface/telegram-bot.md
  - 3. The Agent:
      - "Workflow Design": agent/workflow-design.md
      - "Identity Injection (SOUL/SKILL)": agent/identity-injection.md
      - "Research Agent Example": agent/example-agent.md
      - "MCP Tools: Useful Abilities": agent/mcp-tools.md
  - 4. Documentation:
      - "MkDocs: Build the Wiki": docs-site/mkdocs-setup.md
      - "GitHub Pages: Go Public": docs-site/github-pages.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/analytics-events.js
  - javascripts/email-signup.js

extra:
  # Google Analytics 4 (P1.5 D / P2.4). Material injects gtag.js for this property.
  # Funnel events (diversion CTA + email capture) are sent from
  # javascripts/analytics-events.js via the data-analytics-event hooks.
  analytics:
    provider: google
    property: G-FK33KEZD5K
  header_links:
    - label: SICIC Website
      url: https://community.sicic.org
    - label: Workshops
      url: https://community.sicic.org/workshops/
    - label: About
      url: https://community.sicic.org/about/
